# Desenvolvimento local com Docker (OrbStack):
#   docker compose up --build      → serve em http://localhost:8080 com recarga automática
#   docker compose run --rm jekyll bundle exec jekyll build   → build único em _site/
services:
  jekyll:
    image: carromeu-site:dev
    build: .
    ports:
      - "8080:8080"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
